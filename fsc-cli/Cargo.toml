[package]
name = "fsc-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fsc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
fsc-compiler = { path = "../fsc-compiler" }
fsc-diagnostics = { path = "../fsc-diagnostics" }
fsb-patcher = { path = "../fsb-patcher" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
